<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHASE 404</title>

<style>

  background:radial-gradient(circle,#1c2230,#07080a 65%);

  z-index:10;
}

.card{

</style>

<div id="menu">

```
<h1>CHASE 404</h1>

<p>3D 멀티플레이 술래잡기</p>

<input
  id="roomInput"

</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';


// ==================================================
// UI / SOCKET
// ==================================================

const socket = io();

const menu =
document.querySelector('#menu');

const playBtn =
document.querySelector('#playBtn');

const roomInput =
document.querySelector('#roomInput');

const statusEl =
document.querySelector('#status');

const roomText =
document.querySelector('#roomText');


// ==================================================
// 게임 상태
// ==================================================

let started = false;

let myId = '';

const keys = {};

const players = new Map();

let obstacles = [];


// ==================================================
// 내 플레이어 위치
// 서버 상태와 로컬 이동을 분리
// ==================================================

const local = {

  x:0,

  z:0,

  rot:0

};


// ==================================================
// 카메라
// ==================================================

let yaw = 0;

let pitch = -0.2;


// ==================================================
// THREE.JS
// ==================================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x08090c);

scene.fog =
new THREE.Fog(
  0x08090c,
  35,
  120
);


const camera =
new THREE.PerspectiveCamera(

  70,

  innerWidth / innerHeight,

  0.1,

  300

);


const renderer =
new THREE.WebGLRenderer({

  antialias:true

});


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.setPixelRatio(

  Math.min(
    devicePixelRatio,
    2
  )

);


document.body.appendChild(
  renderer.domElement
);


// ==================================================
// 조명
// ==================================================

scene.add(

  new THREE.HemisphereLight(

    0xffffff,

    0x223344,

    2

  )

);


const sun =
new THREE.DirectionalLight(

  0xffffff,

  2

);


sun.position.set(
  20,
  30,
  10
);


scene.add(sun);


// ==================================================
// 바닥
// ==================================================

const floor =
new THREE.Mesh(

  new THREE.BoxGeometry(
    100,
    1,
    100
  ),

  new THREE.MeshStandardMaterial({

    color:0x30343c

  })

);


floor.position.y = -0.5;

scene.add(floor);


// ==================================================
// 맵
// ==================================================

const wallMat =
new THREE.MeshStandardMaterial({

  color:0x555b66

});


function createMapObject(o){

  if(!o){
    return;
  }

  const mesh =
  new THREE.Mesh(

    new THREE.BoxGeometry(

      Number(o.w) || 1,

      4,

      Number(o.d) || 1

    ),

    wallMat

  );


  mesh.position.set(

    Number(o.x) || 0,

    2,

    Number(o.z) || 0

  );


  mesh.userData.mapObject =
  true;


  scene.add(mesh);

}


function updateMap(newObstacles){

  if(!Array.isArray(newObstacles)){

    console.warn(
      '[CHASE404] 맵 데이터가 배열이 아님:',
      newObstacles
    );

    return;

  }


  obstacles =
  newObstacles;


  // 기존 맵 오브젝트 제거

  for(

    const child
    of [...scene.children]

  ){

    if(

      child.userData &&
      child.userData.mapObject

    ){

      scene.remove(child);

    }

  }


  // 새 맵 생성

  for(

    const obstacle
    of obstacles

  ){

    createMapObject(
      obstacle
    );

  }


  console.log(
    '[CHASE404] 맵 업데이트:',
    obstacles.length,
    '개'
  );

}


// ==================================================
// 충돌
// ==================================================

function blocked(x,z){

  const radius = 0.35;


  for(

    const o
    of obstacles

  ){

    const ox =
    Number(o.x) || 0;

    const oz =
    Number(o.z) || 0;

    const ow =
    Number(o.w) || 1;

    const od =
    Number(o.d) || 1;


    const minX =

    ox -
    ow / 2 -
    radius;


    const maxX =

    ox +
    ow / 2 +
    radius;


    const minZ =

    oz -
    od / 2 -
    radius;


    const maxZ =

    oz +
    od / 2 +
    radius;


    if(

      x > minX &&
      x < maxX &&
      z > minZ &&
      z < maxZ

    ){

      return true;

    }

  }


  return false;

}


// ==================================================
// 플레이어 생성
// ==================================================

function makePlayer(id,data){

  const group =
  new THREE.Group();


  // 몸

  const body =
  new THREE.Mesh(

    new THREE.BoxGeometry(

      0.9,

      2,

      0.9

    ),

    new THREE.MeshStandardMaterial({

      color:

      data &&
      data.it

      ? 0xff3b30
      : 0x36a3ff

    })

  );


  body.position.y = 1;

  group.add(body);


  // 머리

  const head =
  new THREE.Mesh(

    new THREE.SphereGeometry(

      0.4,

      16,

      16

    ),

    new THREE.MeshStandardMaterial({

      color:

      data &&
      data.it

      ? 0xff8888
      : 0x88ccff

    })

  );


  head.position.y = 2.3;

  group.add(head);


  // 플레이어 데이터

  group.userData.player = true;

  group.userData.id = id;


  return group;

}


// ==================================================
// 플레이어 생성 또는 가져오기
// ==================================================

function getOrCreatePlayer(id,data){

  let mesh =
  players.get(id);


  if(mesh){

    return mesh;

  }


  console.log(
    '[CHASE404] 플레이어 생성:',
    id
  );


  mesh =
  makePlayer(
    id,
    data || {}
  );


  scene.add(mesh);

  players.set(
    id,
    mesh
  );


  return mesh;

}


// ==================================================
// 플레이어 외형 업데이트
// ==================================================

function updatePlayerVisual(mesh,data){

  if(!mesh || !data){

    return;

  }


  const isChaser =
  !!data.it;


  const body =
  mesh.children[0];

  const head =
  mesh.children[1];


  if(body){

    body.material.color.setHex(

      isChaser

      ? 0xff3b30
      : 0x36a3ff

    );

  }


  if(head){

    head.material.color.setHex(

      isChaser

      ? 0xff8888
      : 0x88ccff

    );

  }

}


// ==================================================
// 내 캐릭터 즉시 생성
// ==================================================

function createMyPlayer(data){

  if(!myId){

    console.warn(
      '[CHASE404] myId가 없음'
    );

    return;

  }


  const mesh =
  getOrCreatePlayer(

    myId,

    data || {}

  );


  mesh.position.set(

    local.x,

    0,

    local.z

  );


  console.log(
    '[CHASE404] 내 캐릭터 생성 완료:',
    myId,
    '위치:',
    local.x,
    local.z
  );

}


// ==================================================
// 플레이어 동기화
// ==================================================

function syncPlayers(data){

  if(!data){

    console.warn(
      '[CHASE404] players 데이터 없음'
    );

    return;

  }


  console.log(
    '[CHASE404] STATE 수신:',
    data
  );


  for(

    const [
      id,
      p
    ]

    of Object.entries(data)

  ){

    if(!p){

      continue;

    }


    // ==========================================
    // 내 플레이어
    // ==========================================

    if(id === myId){

      // 서버 위치를 기준으로 동기화

      local.x =
      Number(p.x) || 0;

      local.z =
      Number(p.z) || 0;

      local.rot =
      Number(p.rot) || 0;


      const myMesh =
      getOrCreatePlayer(

        id,

        p

      );


      // 내 캐릭터는 서버 위치 반영

      myMesh.position.set(

        local.x,

        0,

        local.z

      );


      myMesh.rotation.y =
      local.rot;


      updatePlayerVisual(

        myMesh,

        p

      );


      continue;

    }


    // ==========================================
    // 다른 플레이어
    // ==========================================

    const mesh =
    getOrCreatePlayer(

      id,

      p

    );


    mesh.position.set(

      Number(p.x) || 0,

      0,

      Number(p.z) || 0

    );


    mesh.rotation.y =

    Number(p.rot) || 0;


    updatePlayerVisual(

      mesh,

      p

    );

  }


  // ==========================================
  // 나간 플레이어 제거
  // ==========================================

  for(

    const [
      id,
      mesh
    ]

    of players

  ){

    if(!data[id]){

      console.log(
        '[CHASE404] 플레이어 제거:',
        id
      );


      scene.remove(mesh);

      players.delete(id);

    }

  }


  console.log(
    '[CHASE404] 현재 캐릭터 수:',
    players.size
  );

}


// ==================================================
// 서버 연결
// ==================================================

socket.on(

  'connect',

  ()=>{

    console.log(
      '[CHASE404] 서버 연결:',
      socket.id
    );


    statusEl.textContent =
    '서버 연결됨';

  }

);


// ==================================================
// 방 입장
// ==================================================

socket.on(

  'joined',

  data =>{

    console.log(
      '[CHASE404] 방 입장:',
      data
    );


    started = true;

    myId =
    data.id;


    // ==========================================
    // 서버가 시작 위치를 보내준 경우 적용
    // ==========================================

    if(data.x !== undefined){

      local.x =
      Number(data.x) || 0;

    }


    if(data.z !== undefined){

      local.z =
      Number(data.z) || 0;

    }


    if(data.rot !== undefined){

      local.rot =
      Number(data.rot) || 0;

    }


    // ==========================================
    // 메뉴 숨김
    // ==========================================

    menu.style.display =
    'none';


    roomText.textContent =

    '방 코드: ' +
    data.room;


    // ==========================================
    // 맵 적용
    // ==========================================

    if(data.obstacles){

      updateMap(
        data.obstacles
      );

    }


    // ==========================================
    // 내 캐릭터 즉시 생성
    // ==========================================

    createMyPlayer(

      data.player ||
      data

    );


    // ==========================================
    // 카메라 초기 위치
    // ==========================================

    camera.position.set(

      local.x,

      3.5,

      local.z + 8

    );


    camera.lookAt(

      local.x,

      1.1,

      local.z

    );


    // 마우스 잠금

    renderer.domElement
    .requestPointerLock();

  }

);


// ==================================================
// 게임 상태
// ==================================================

socket.on(

  'state',

  data =>{

    console.log(
      '[CHASE404] STATE 수신:',
      data
    );


    if(!data){

      console.warn(
        '[CHASE404] state 데이터가 없음'
      );

      return;

    }


    // 플레이어 데이터

    syncPlayers(

      data.players || {}

    );


    // 맵 데이터

    if(data.obstacles){

      updateMap(

        data.obstacles

      );

    }


    const playerCount =

    Object.keys(

      data.players || {}

    ).length;


    statusEl.textContent =

    `접속자 ${playerCount}명 · ` +

    (

      data.chaser

      ? '술래: ' +
        String(
          data.chaser
        ).slice(
          0,
          5
        )

      : '술래 선정 중'

    );

  }

);


// ==================================================
// 서버 오류
// ==================================================

socket.on(

  'errorMessage',

  message =>{

    console.error(
      '[CHASE404] 서버 오류:',
      message
    );


    alert(message);

  }

);


// ==================================================
// 방 참가
// ==================================================

playBtn.onclick =

()=>{

  const room =

  (

    roomInput.value ||
    ''

  )

  .trim()
  .toUpperCase();


  console.log(
    '[CHASE404] 방 참가 요청:',
    room
  );


  socket.emit(

    'joinRoom',

    room

  );

};


// ==================================================
// 키보드
// ==================================================

addEventListener(

  'keydown',

  event =>{

    keys[
      event.key.toLowerCase()
    ] = true;

  }

);


addEventListener(

  'keyup',

  event =>{

    keys[
      event.key.toLowerCase()
    ] = false;

  }

);


// ==================================================
// 마우스 카메라
// ==================================================

renderer.domElement.onclick =

()=>{

  renderer.domElement
  .requestPointerLock();

};


addEventListener(

  'mousemove',

  event =>{

    if(

      document.pointerLockElement
      !==
      renderer.domElement

    ){

      return;

    }


    yaw -=

    event.movementX *

    0.0025;


    pitch -=

    event.movementY *

    0.0025;


    pitch = Math.max(

      -0.6,

      Math.min(

        0.6,

        pitch

      )

    );

  }

);


// ==================================================
// 게임 루프
// ==================================================

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const dt =

  Math.min(

    clock.getDelta(),

    0.05

  );


  if(started && myId){

    // ==========================================
    // WASD 입력
    // ==========================================

    let forward =

    (keys.w ? 1 : 0)

    -

    (keys.s ? 1 : 0);


    let right =

    (keys.d ? 1 : 0)

    -

    (keys.a ? 1 : 0);


    const length =

    Math.hypot(

      forward,

      right

    ) || 1;


    forward /= length;

    right /= length;


    // ==========================================
    // 카메라 기준 이동
    // ==========================================

    const dx =

    Math.sin(yaw) *

    forward

    +

    Math.cos(yaw) *

    right;


    const dz =

    Math.cos(yaw) *

    forward

    -

    Math.sin(yaw) *

    right;


    const speed =
    7 * dt;


    const nextX =

    local.x +

    dx * speed;


    const nextZ =

    local.z +

    dz * speed;


    // ==========================================
    // X축 충돌
    // ==========================================

    if(

      !blocked(

        nextX,

        local.z

      )

    ){

      local.x =

      Math.max(

        -47,

        Math.min(

          47,

          nextX

        )

      );

    }


    // ==========================================
    // Z축 충돌
    // ==========================================

    if(

      !blocked(

        local.x,

        nextZ

      )

    ){

      local.z =

      Math.max(

        -47,

        Math.min(

          47,

          nextZ

        )

      );

    }


    local.rot =
    yaw;


    // ==========================================
    // 내 캐릭터 위치 즉시 반영
    // ==========================================

    const myMesh =
    players.get(myId);


    if(myMesh){

      myMesh.position.set(

        local.x,

        0,

        local.z

      );


      myMesh.rotation.y =
      local.rot;

    }


    // ==========================================
    // 서버에 이동 전송
    // ==========================================

    socket.emit(

      'move',

      {

        x:
        local.x,

        z:
        local.z,

        rot:
        local.rot

      }

    );


    // ==========================================
    // 3인칭 카메라
    // ==========================================

    const distance =
    8;


    const cameraX =

    local.x

    -

    Math.sin(yaw)

    *

    Math.cos(pitch)

    *

    distance;


    const cameraY =

    Math.max(

      1.5,

      3.5

      +

      Math.sin(pitch)

      *

      distance

    );


    const cameraZ =

    local.z

    -

    Math.cos(yaw)

    *

    Math.cos(pitch)

    *

    distance;


    camera.position.set(

      cameraX,

      cameraY,

      cameraZ

    );


    camera.lookAt(

      local.x,

      1.1,

      local.z

    );

  }


  renderer.render(

    scene,

    camera

  );

}


animate();


// ==================================================
// 화면 크기
// ==================================================

addEventListener(

  'resize',

  ()=>{

    camera.aspect =

    innerWidth /

    innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      innerWidth,

      innerHeight

    );

  }

);

</script>

</body>
</html>
