<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHASE 404</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090c;
  color:#fff;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#top{
  position:absolute;
  top:14px;
  left:14px;
  background:#111a;
  padding:10px 14px;
  border-radius:12px;
}

#status{
  font-weight:bold;
}

.small{
  font-size:12px;
  opacity:.7;
  margin-top:4px;
}

#menu{
  pointer-events:auto;
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#1c2230,#07080a 65%);
}

.card{
  width:min(420px,calc(100% - 40px));
  padding:28px;
  border:1px solid #ffffff22;
  border-radius:20px;
  background:#1118;
  text-align:center;
}

h1{
  margin:0 0 8px;
  font-size:42px;
  letter-spacing:4px;
}

p{
  opacity:.75;
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ffffff22;
  background:#0b0d12;
  color:white;
  font-size:16px;
}

button{
  cursor:pointer;
  background:#fff;
  color:#111;
  font-weight:bold;
}

#hint{
  font-size:12px;
  opacity:.65;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="menu">
  <div class="card">

    <h1>CHASE 404</h1>

    <p>
      3D 멀티플레이 술래잡기
    </p>

    <input
      id="roomInput"
      placeholder="방 코드 (비워두면 새 방)"
      maxlength="12"
    >

    <button id="playBtn">
      게임 시작 / 방 만들기
    </button>

    <div id="hint">
      WASD 이동 · 마우스 시점 · 클릭으로 시점 잠금
    </div>

  </div>
</div>


<div id="ui">

  <div id="top">

    <div id="status">
      연결 중...
    </div>

    <div
      class="small"
      id="roomText"
    ></div>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';


// ========================================
// 서버
// ========================================

const socket = io();


// ========================================
// UI
// ========================================

const menu =
document.querySelector('#menu');

const playBtn =
document.querySelector('#playBtn');

const roomInput =
document.querySelector('#roomInput');

const statusEl =
document.querySelector('#status');

const roomText =
document.querySelector('#roomText');


// ========================================
// 게임 상태
// ========================================

let started = false;

let myId = '';

const keys = {};

const players = new Map();

let obstacles = [];


// ========================================
// 내 위치
// ========================================

const local = {

  x:0,

  z:0,

  rot:0

};


// ========================================
// 카메라
// ========================================

let yaw = 0;

let pitch = -0.25;


// ========================================
// THREE
// ========================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x08090c);

scene.fog =
new THREE.Fog(
  0x08090c,
  35,
  120
);


const camera =
new THREE.PerspectiveCamera(

  70,

  innerWidth / innerHeight,

  0.1,

  300

);


const renderer =
new THREE.WebGLRenderer({

  antialias:true

});


renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

document.body.appendChild(
  renderer.domElement
);


// ========================================
// 조명
// ========================================

scene.add(

  new THREE.HemisphereLight(

    0xffffff,

    0x223344,

    2

  )

);


const sun =
new THREE.DirectionalLight(

  0xffffff,

  2

);

sun.position.set(
  20,
  30,
  10
);

scene.add(sun);


// ========================================
// 바닥
// ========================================

const floor =
new THREE.Mesh(

  new THREE.BoxGeometry(
    100,
    1,
    100
  ),

  new THREE.MeshStandardMaterial({

    color:0x30343c

  })

);

floor.position.y = -0.5;

scene.add(floor);


// ========================================
// 외벽
// ========================================

const wallMat =
new THREE.MeshStandardMaterial({

  color:0x555b66

});


function createWall(
  x,
  z,
  w,
  d
){

  const wall =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      w,
      5,
      d
    ),

    wallMat

  );

  wall.position.set(
    x,
    2.5,
    z
  );

  wall.userData.mapObject = true;

  scene.add(wall);

}


// 외벽

createWall(
  0,
  -50,
  100,
  2
);

createWall(
  0,
  50,
  100,
  2
);

createWall(
  -50,
  0,
  2,
  100
);

createWall(
  50,
  0,
  2,
  100
);


// ========================================
// 맵 조형물
// ========================================

function updateMap(
  newObstacles
){

  if(
    !Array.isArray(
      newObstacles
    )
  ){

    return;

  }


  obstacles =
  newObstacles;


  // 기존 맵 오브젝트 제거

  for(

    const child
    of [...scene.children]

  ){

    if(
      child.userData &&
      child.userData.mapObject
    ){

      scene.remove(child);

    }

  }


  // 서버 맵 생성

  for(

    const obstacle
    of obstacles

  ){

    const mesh =
    new THREE.Mesh(

      new THREE.BoxGeometry(

        obstacle.w,

        4,

        obstacle.d

      ),

      wallMat

    );


    mesh.position.set(

      obstacle.x,

      2,

      obstacle.z

    );


    mesh.userData.mapObject =
    true;


    scene.add(mesh);

  }

}


// ========================================
// 충돌 검사
// ========================================

function blocked(
  x,
  z
){

  // 충돌 반경 감소
  // 벽에 너무 일찍 막히는 문제 수정

  const radius = 0.35;


  for(

    const o
    of obstacles

  ){

    const minX =
    o.x -
    o.w / 2 -
    radius;


    const maxX =
    o.x +
    o.w / 2 +
    radius;


    const minZ =
    o.z -
    o.d / 2 -
    radius;


    const maxZ =
    o.z +
    o.d / 2 +
    radius;


    if(

      x > minX &&
      x < maxX &&
      z > minZ &&
      z < maxZ

    ){

      return true;

    }

  }


  return false;

}


// ========================================
// 플레이어 생성
// ========================================

function makePlayer(
  id,
  data
){

  const group =
  new THREE.Group();


  // 몸

  const body =
  new THREE.Mesh(

    new THREE.CapsuleGeometry(

      0.45,
      1,
      6,
      12

    ),

    new THREE.MeshStandardMaterial({

      color:

      data.it

      ? 0xff3b30

      : 0x36a3ff

    })

  );


  // 바닥에 서도록 설정

  body.position.y = 1;


  group.add(body);


  // 머리

  const head =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      0.38,
      16,
      16
    ),

    new THREE.MeshStandardMaterial({

      color:

      data.it

      ? 0xff7770

      : 0x77c4ff

    })

  );


  head.position.y = 1.9;


  group.add(head);


  group.userData.player =
  true;


  group.userData.id =
  id;


  return group;

}


// ========================================
// 플레이어 동기화
// ========================================

function syncPlayers(
  data
){

  for(

    const [
      id,
      p
    ]

    of Object.entries(data)

  ){

    // 플레이어가 없으면 생성

    if(
      !players.has(id)
    ){

      const mesh =
      makePlayer(
        id,
        p
      );


      scene.add(mesh);


      players.set(
        id,
        mesh
      );

    }


    const mesh =
    players.get(id);


    // 위치

    mesh.position.set(

      p.x,

      0,

      p.z

    );


    // 회전

    mesh.rotation.y =
    p.rot || 0;


    // 색

    const color =
    p.it

    ? 0xff3b30

    : 0x36a3ff;


    mesh.children[0]
    .material
    .color
    .setHex(color);


    mesh.children[1]
    .material
    .color
    .setHex(

      p.it

      ? 0xff7770

      : 0x77c4ff

    );

  }


  // 나간 플레이어 제거

  for(

    const [
      id,
      mesh
    ]

    of players

  ){

    if(
      !data[id]
    ){

      scene.remove(mesh);

      players.delete(id);

    }

  }

}


// ========================================
// 서버 연결
// ========================================

socket.on(

  'connect',

  ()=>{

    statusEl.textContent =
    '서버 연결됨';

  }

);


// ========================================
// 방 입장
// ========================================

socket.on(

  'joined',

  data =>{

    started = true;

    myId = data.id;


    menu.style.display =
    'none';


    roomText.textContent =
    '방 코드: ' +
    data.room;


    // 서버 맵

    if(
      data.obstacles
    ){

      updateMap(
        data.obstacles
      );

    }


    // 내 위치를 서버 데이터로 초기화

    if(
      data.id
    ){

      local.x = 0;

      local.z = 0;

    }


    renderer.domElement
    .requestPointerLock();

  }

);


// ========================================
// 상태
// ========================================

socket.on(

  'state',

  data =>{

    syncPlayers(
      data.players
    );


    if(
      data.obstacles
    ){

      updateMap(
        data.obstacles
      );

    }


    statusEl.textContent =

    `접속자 ${
      Object.keys(
        data.players
      ).length
    }명 · ` +

    (

      data.chaser

      ? '술래: ' +
        data.chaser.slice(
          0,
          5
        )

      : '술래 선정 중'

    );

  }

);


// ========================================
// 오류
// ========================================

socket.on(

  'errorMessage',

  message =>{

    alert(message);

  }

);


// ========================================
// 방 입장
// ========================================

playBtn.onclick =

()=>{

  socket.emit(

    'joinRoom',

    (

      roomInput.value ||
      ''

    )

    .trim()
    .toUpperCase()

  );

};


// ========================================
// 키보드
// ========================================

addEventListener(

  'keydown',

  e =>{

    keys[
      e.key.toLowerCase()
    ] = true;

  }

);


addEventListener(

  'keyup',

  e =>{

    keys[
      e.key.toLowerCase()
    ] = false;

  }

);


// ========================================
// 마우스 카메라
// ========================================

renderer.domElement.onclick =

()=>{

  renderer.domElement
  .requestPointerLock();

};


addEventListener(

  'mousemove',

  e =>{

    if(

      document.pointerLockElement
      !==
      renderer.domElement

    ){

      return;

    }


    yaw -=
    e.movementX *
    0.0025;


    pitch -=
    e.movementY *
    0.0025;


    // 카메라가 바닥을 뚫지 않도록

    pitch = Math.max(

      -0.65,

      Math.min(

        0.65,

        pitch

      )

    );

  }

);


// ========================================
// 게임 루프
// ========================================

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const dt =
  Math.min(

    clock.getDelta(),

    0.05

  );


  if(
    started
  ){

    let x =

    (keys.d ? 1 : 0)

    -

    (keys.a ? 1 : 0);


    let z =

    (keys.s ? 1 : 0)

    -

    (keys.w ? 1 : 0);


    const length =

    Math.hypot(
      x,
      z
    ) || 1;


    x /= length;

    z /= length;


    // 기존 A/D 반전 유지


    const dx =

    Math.sin(yaw) *
    z

    +

    Math.cos(yaw) *
    x;


    const dz =

    Math.cos(yaw) *
    z

    -

    Math.sin(yaw) *
    x;


    const speed =
    7 * dt;


    const nextX =

    local.x +

    dx * speed;


    const nextZ =

    local.z +

    dz * speed;


    // X축 충돌

    if(

      !blocked(

        nextX,

        local.z

      )

    ){

      local.x =

      Math.max(

        -47,

        Math.min(

          47,

          nextX

        )

      );

    }


    // Z축 충돌

    if(

      !blocked(

        local.x,

        nextZ

      )

    ){

      local.z =

      Math.max(

        -47,

        Math.min(

          47,

          nextZ

        )

      );

    }


    local.rot =
    yaw;


    // 서버 전송

    socket.emit(

      'move',

      local

    );


    // ==================================
    // 카메라
    // ==================================

    const distance =
    7;


    const cameraX =

    local.x

    -

    Math.sin(yaw)

    *

    Math.cos(pitch)

    *

    distance;


    // 바닥 아래로 내려가지 않도록 제한

    const cameraY =

    Math.max(

      1.4,

      2.5

      +

      Math.sin(pitch)

      *

      distance

    );


    const cameraZ =

    local.z

    -

    Math.cos(yaw)

    *

    Math.cos(pitch)

    *

    distance;


    camera.position.set(

      cameraX,

      cameraY,

      cameraZ

    );


    camera.lookAt(

      local.x,

      1.2,

      local.z

    );

  }


  renderer.render(

    scene,

    camera

  );

}


animate();


// ========================================
// 화면 크기
// ========================================

addEventListener(

  'resize',

  ()=>{

    camera.aspect =

    innerWidth /
    innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      innerWidth,

      innerHeight

    );

  }

);

</script>

</body>
</html>
