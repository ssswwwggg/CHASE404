<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHASE 404</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Consolas, monospace;
}

#ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#menu {
    pointer-events: auto;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

h1 {
    font-size: 50px;
    margin-bottom: 30px;
    color: #00ff66;
}

input, button {
    padding: 12px;
    margin: 5px;
    font-size: 18px;
    background: #111;
    color: white;
    border: 1px solid #00ff66;
}

button:hover {
    background:#00ff66;
    color:black;
}

#info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:16px;
}
</style>

</head>


<body>

<div id="ui">

    <div id="menu">
        <h1>CHASE 404</h1>

        <input id="roomInput" placeholder="방 코드">

        <button id="playBtn">
            PLAY
        </button>

        <p>
            WASD 이동 · 마우스 시점
        </p>

    </div>


    <div id="info"></div>

</div>


<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>


<!-- 게임 코드 -->
<script type="module" src="./client.js"></script>


</body>
</html>
