<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHASE 404</title>

<style>
html,body{

}

}

}

#menu{
  pointer-events:auto;
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#1c2230,#07080a 65%);
  z-index:20;
}

.card{
  width:min(420px,calc(100% - 40px));
  padding:28px;
  border:1px solid #ffffff22;

  margin:0 0 8px;

}

  opacity:.75;
}

  width:100%;

}
</style>

</head>

<body>

<div id="menu">
  <div class="card">

```
<h1>CHASE 404</h1>

<p>3D 멀티플레이 술래잡기</p>

<input
  id="roomInput"
  placeholder="방 코드 (비워두면 새 방)"

  게임 시작 / 방 만들기
</button>

</div>

<div id="ui">

  <div id="top">

```
<div id="status">
  서버 연결 중...
</div>

<div
  class="small"
  id="roomText"
></div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';


// ==================================================
// 기본 설정
// ==================================================

const socket = io();

const menu =
document.querySelector('#menu');

const playBtn =
document.querySelector('#playBtn');

const roomInput =
document.querySelector('#roomInput');

const statusEl =
document.querySelector('#status');

const roomText =
document.querySelector('#roomText');


let started = false;

let myId = '';


// ==================================================
// 키보드
// ==================================================

const keys = {};


// ==================================================
// 플레이어 저장
// ==================================================

const players = new Map();


// ==================================================
// 내 플레이어 위치
// ==================================================

const local = {

  x:0,

  z:0,

  rot:0

};


// ==================================================
// 카메라
// ==================================================

let yaw = 0;

let pitch = -0.15;


// ==================================================
// Three.js
// ==================================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
  0x08090c
);

scene.fog =
new THREE.Fog(
  0x08090c,
  35,
  120
);


const camera =
new THREE.PerspectiveCamera(

  70,

  innerWidth /
  innerHeight,

  0.1,

  300

);


const renderer =
new THREE.WebGLRenderer({

  antialias:true

});


renderer.setSize(

  innerWidth,

  innerHeight

);


renderer.setPixelRatio(

  Math.min(
    devicePixelRatio,
    2
  )

);


document.body.appendChild(

  renderer.domElement

);


// ==================================================
// 조명
// ==================================================

scene.add(

  new THREE.HemisphereLight(

    0xffffff,

    0x223344,

    2

  )

);


const sun =
new THREE.DirectionalLight(

  0xffffff,

  2

);


sun.position.set(

  20,

  30,

  10

);


scene.add(sun);


// ==================================================
// 바닥
// ==================================================

const floor =
new THREE.Mesh(

  new THREE.BoxGeometry(

    100,

    1,

    100

  ),

  new THREE.MeshStandardMaterial({

    color:0x30343c

  })

);


floor.position.y = -0.5;


scene.add(floor);


// ==================================================
// 서버 맵 충돌 데이터
// ==================================================

let obstacles = [];


// ==================================================
// 맵 오브젝트 저장
// ==================================================

const mapMeshes = [];


// ==================================================
// 맵 초기화
// ==================================================

function clearMap(){

  for(

    const mesh

    of mapMeshes

  ){

    scene.remove(mesh);

  }

  mapMeshes.length = 0;

  obstacles = [];

}


// ==================================================
// 서버 맵 생성
// ==================================================

function buildMap(serverObstacles){

  clearMap();


  if(

    !Array.isArray(
      serverObstacles
    )

  ){

    console.warn(
      '서버 맵 데이터 없음'
    );

    return;

  }


  const wallMat =
  new THREE.MeshStandardMaterial({

    color:0x555b66

  });


  for(

    const o

    of serverObstacles

  ){

    obstacles.push({

      x:o.x,

      z:o.z,

      w:o.w,

      d:o.d

    });


    const mesh =
    new THREE.Mesh(

      new THREE.BoxGeometry(

        o.w,

        5,

        o.d

      ),

      wallMat

    );


    mesh.position.set(

      o.x,

      2.5,

      o.z

    );


    scene.add(mesh);

    mapMeshes.push(mesh);

  }

}


// ==================================================
// 충돌 검사
// ==================================================

function blocked(

  x,

  z

){

  const radius = 0.7;


  for(

    const o

    of obstacles

  ){

    const minX =

    o.x -

    o.w / 2 -

    radius;


    const maxX =

    o.x +

    o.w / 2 +

    radius;


    const minZ =

    o.z -

    o.d / 2 -

    radius;


    const maxZ =

    o.z +

    o.d / 2 +

    radius;


    if(

      x > minX &&

      x < maxX &&

      z > minZ &&

      z < maxZ

    ){

      return true;

    }

  }


  return false;

}


// ==================================================
// 플레이어 생성
// ==================================================

function makePlayer(

  id,

  p

){

  const group =
  new THREE.Group();


  // 몸통

  const body =
  new THREE.Mesh(

    new THREE.CapsuleGeometry(

      0.45,

      1,

      6,

      12

    ),

    new THREE.MeshStandardMaterial({

      color:

      p.it

      ? 0xff3b30

      : 0x36a3ff

    })

  );


  body.position.y = 1;


  group.add(body);


  // 머리 위 표시

  const marker =
  new THREE.Mesh(

    new THREE.SphereGeometry(

      0.15,

      12,

      12

    ),

    new THREE.MeshStandardMaterial({

      color:

      p.it

      ? 0xff3b30

      : 0xffffff

    })

  );


  marker.position.y = 2.1;


  group.add(marker);


  // 내 캐릭터 표시

  if(

    id === myId

  ){

    group.scale.set(

      1.1,

      1.1,

      1.1

    );

  }


  scene.add(group);


  return group;

}


// ==================================================
// 플레이어 상태 동기화
// ==================================================

function syncPlayers(

  data

){

  if(!data){

    return;

  }


  const activeIds =
  new Set();


  for(

    const [

      id,

      p

    ]

    of Object.entries(data)

  ){

    activeIds.add(id);


    // 새 플레이어 생성

    if(

      !players.has(id)

    ){

      const mesh =

      makePlayer(

        id,

        p

      );


      players.set(

        id,

        mesh

      );

    }


    const mesh =

    players.get(id);


    // 서버 위치 적용

    mesh.position.x =

    Number(p.x) || 0;


    mesh.position.y =

    0;


    mesh.position.z =

    Number(p.z) || 0;


    mesh.rotation.y =

    Number(p.rot) || 0;


    // 술래 색상 변경

    const body =

    mesh.children[0];


    if(

      body &&

      body.material

    ){

      body.material.color.setHex(

        p.it

        ? 0xff3b30

        : 0x36a3ff

      );

    }


    // 머리 위 표시 색상

    const marker =

    mesh.children[1];


    if(

      marker &&

      marker.material

    ){

      marker.material.color.setHex(

        p.it

        ? 0xff3b30

        : 0xffffff

      );

    }


    // 내 위치도 서버 기준으로 보정

    if(

      id === myId

    ){

      local.x =

      Number(p.x) || 0;


      local.z =

      Number(p.z) || 0;


      local.rot =

      Number(p.rot) || 0;

    }

  }


  // 나간 플레이어 제거

  for(

    const [

      id,

      mesh

    ]

    of players

  ){

    if(

      !activeIds.has(id)

    ){

      scene.remove(mesh);

      players.delete(id);

    }

  }

}


// ==================================================
// 서버 연결
// ==================================================

socket.on(

  'connect',

  ()=>{

    statusEl.textContent =

    '서버 연결됨';

  }

);


// ==================================================
// 서버 연결 끊김
// ==================================================

socket.on(

  'disconnect',

  ()=>{

    statusEl.textContent =

    '서버 연결 끊김';

  }

);


// ==================================================
// 방 입장 완료
// ==================================================

socket.on(

  'joined',

  d=>{

    started = true;


    myId = d.id;


    menu.style.display =

    'none';


    roomText.textContent =

    '방 코드: ' +

    d.room;


    // 서버 맵 사용

    buildMap(

      d.obstacles

    );


    renderer.domElement

    .requestPointerLock();

  }

);


// ==================================================
// 서버 상태 수신
// ==================================================

socket.on(

  'state',

  d=>{

    // 서버 맵이 변경되었으면 갱신

    if(

      d.obstacles

    ){

      buildMap(

        d.obstacles

      );

    }


    // 플레이어 동기화

    syncPlayers(

      d.players

    );


    const count =

    Object.keys(

      d.players || {}

    ).length;


    statusEl.textContent =

    `접속자 ${count}명 · ` +

    (

      d.chaser

      ? '술래: ' +

        d.chaser.slice(

          0,

          5

        )

      : '술래 선정 중'

    );

  }

);


// ==================================================
// 서버 오류
// ==================================================

socket.on(

  'errorMessage',

  message=>{

    alert(message);

  }

);


// ==================================================
// 방 참가
// ==================================================

playBtn.onclick =

()=>{

  const room =

  (

    roomInput.value || ''

  )

  .trim()

  .toUpperCase();


  socket.emit(

    'joinRoom',

    room

  );

};


// ==================================================
// 키보드
// ==================================================

addEventListener(

  'keydown',

  e=>{

    keys[

      e.key.toLowerCase()

    ] = true;

  }

);


addEventListener(

  'keyup',

  e=>{

    keys[

      e.key.toLowerCase()

    ] = false;

  }

);


// ==================================================
// 마우스 시점
// ==================================================

renderer.domElement.onclick =

()=>{

  renderer.domElement

  .requestPointerLock();

};


addEventListener(

  'mousemove',

  e=>{

    if(

      document.pointerLockElement !==

      renderer.domElement

    ){

      return;

    }


    yaw -=

    e.movementX *

    0.0025;


    pitch -=

    e.movementY *

    0.0025;


    pitch =

    Math.max(

      -1.2,

      Math.min(

        1.2,

        pitch

      )

    );

  }

);


// ==================================================
// 게임 루프
// ==================================================

const clock =

new THREE.Clock();


function animate(){

  requestAnimationFrame(

    animate

  );


  const dt =

  Math.min(

    clock.getDelta(),

    0.05

  );


  if(started){

    let forward =

    (

      keys.w ? 1 : 0

    ) -

    (

      keys.s ? 1 : 0

    );


    let right =

    (

      keys.d ? 1 : 0

    ) -

    (

      keys.a ? 1 : 0

    );


    const len =

    Math.hypot(

      forward,

      right

    ) || 1;


    forward /= len;

    right /= len;


    // 카메라 기준 이동

    const dx =

    Math.sin(yaw) *

    forward +

    Math.cos(yaw) *

    right;


    const dz =

    Math.cos(yaw) *

    forward -

    Math.sin(yaw) *

    right;


    const speed =

    7 * dt;


    const nextX =

    local.x +

    dx *

    speed;


    const nextZ =

    local.z +

    dz *

    speed;


    // X축 이동

    if(

      !blocked(

        nextX,

        local.z

      )

    ){

      local.x =

      Math.max(

        -47,

        Math.min(

          47,

          nextX

        )

      );

    }


    // Z축 이동

    if(

      !blocked(

        local.x,

        nextZ

      )

    ){

      local.z =

      Math.max(

        -47,

        Math.min(

          47,

          nextZ

        )

      );

    }


    local.rot =

    yaw;


    // 서버에 내 위치 전송

    socket.emit(

      'move',

      {

        x:local.x,

        z:local.z,

        rot:local.rot

      }

    );


    // 카메라

    const distance =

    7;


    const camX =

    local.x -

    Math.sin(yaw) *

    Math.cos(pitch) *

    distance;


    const camY =

    2.5 +

    Math.sin(pitch) *

    distance;


    const camZ =

    local.z -

    Math.cos(yaw) *

    Math.cos(pitch) *

    distance;


    camera.position.set(

      camX,

      camY,

      camZ

    );


    camera.lookAt(

      local.x,

      1.2,

      local.z

    );

  }


  renderer.render(

    scene,

    camera

  );

}


animate();


// ==================================================
// 화면 크기 변경
// ==================================================

addEventListener(

  'resize',

  ()=>{

    camera.aspect =

    innerWidth /

    innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      innerWidth,

      innerHeight

    );

  }

);

</script>

</body>
